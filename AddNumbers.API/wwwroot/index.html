<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Header</h1>
    <h2>Subheader</h2>

    <div class="buttons">
        <button onclick="clearNumbers()">Clear Numbers</button>
        <button onclick="addNumber()">Add Number</button>
        <button onclick="sumNumbers()">Sum Numbers</button>
    </div>

    <div id="numberList"></div>

    <div class="info">
        <p><strong>Count:</strong> <span id="count">0</span></p>
        <p><strong>Sum:</strong> <span id="sum">Not summed</span></p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
